<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo">
            <img src="images/z-wwr-blue.jpg" alt="Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== CONTACT INFO ===== -->
    <div class="contact-info">
        <h1>White Water Rafting Co.</h1>
        <p>123 Main River Street, Kolob, CA</p>
        <p>📞 +1 999 999 999</p>
        <p>📧 info@whitewater.com</p>
    </div>

    <!-- ===== CONTACT BOX ===== -->
    <section class="contact-box">
        <!-- Map -->
        <div>
            <h2>Find Us</h2>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d4383.955592683191!2d114.14538780813577!3d22.487203797596486!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1szh-TW!2shk!4v1785314651769!5m2!1szh-TW!2shk"
              allowfullscreen="" loading="lazy">
            </iframe>
        </div>

        <!-- Contact Form -->
        <div class="contact-form">
            <h2>Send a Message</h2>
            <form action="#">
                <div class="row">
                    <label>Name</label>
                    <input type="text" placeholder="Your name" required>
                </div>
                <div class="row">
                    <label>Email</label>
                    <input type="email" placeholder="Your email" required>
                </div>

                <div class="row">
                    <label>Purpose</label>
                    <div class="radio-group">
                        <label><input type="radio" name="purpose" checked> General</label>
                        <label><input type="radio" name="purpose"> Reservation</label>
                        <label><input type="radio" name="purpose"> Suggestion</label>
                    </div>
                </div>

                <div class="row" style="align-items:flex-start;">
                    <label>Message</label>
                    <textarea placeholder="Your message..."></textarea>
                </div>

                <div class="row" style="border:none; padding:0;">
                    <label></label>
                    <label><input type="checkbox"> Subscribe to newsletter</label>
                </div>

                <div class="row" style="border:none; padding:0;">
                    <label></label>
                    <button type="submit" class="btn">Send</button>
                </div>
            </form>
        </div>
    </section>

    <!-- ===== EMPLOYEES ===== -->
    <section>
        <h2>Our Team</h2>
        <div class="grid-3">
            <div class="card">
                <img src="images/employee1.jpg" alt="Charlotte">
                <h3>Charlotte Carlson</h3>
            </div>
            <div class="card">
                <img src="images/employee4.jpg" alt="Alice">
                <h3>Alice Sellers</h3>
            </div>
            <div class="card">
                <img src="images/employee5.jpg" alt="Dave">
                <h3>Dave Hansen</h3>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ===== -->
    <footer>
        <p>©️2026 🎉Joyous 😊Ricky Wong</p>
        <div class="social">
            <a href="#"><img src="images/facebook.svg" alt="FB"></a>
            <a href="#"><img src="images/instagram.svg" alt="IG"></a>
            <a href="#"><img src="images/linkedin.svg" alt="LI"></a>
        </div>
    </footer>

</body>

</html>
